<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f6b4d" />
    <title>Uber Catalog Builder</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js" defer></script>
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <div class="title-block">
          <span class="eyebrow">Uber catalog build</span>
          <h1>Catalog Builder</h1>
        </div>
        <div class="top-actions">
          <button class="icon-button" id="settingsBtn" type="button" title="Settings" aria-label="Settings">
            <i data-lucide="settings"></i>
          </button>
          <button class="icon-button" id="exportBtn" type="button" title="Export review CSV" aria-label="Export review CSV">
            <i data-lucide="download"></i>
          </button>
        </div>
      </header>

      <section class="context-bar" aria-label="Batch context">
        <label>
          <span>Category</span>
          <input id="categoryInput" type="text" list="categoryList" autocomplete="off" placeholder="Beer" />
        </label>
        <label>
          <span>Shelf / section</span>
          <input id="shelfInput" type="text" autocomplete="off" placeholder="Door 1, top shelf" />
        </label>
        <label>
          <span>Default price</span>
          <input id="priceInput" type="text" inputmode="decimal" autocomplete="off" placeholder="$0.00" />
        </label>
        <datalist id="categoryList"></datalist>
      </section>

      <nav class="mode-tabs" aria-label="Entry modes">
        <button class="active" id="shelfModeBtn" type="button" data-mode="shelf">
          <i data-lucide="camera"></i>
          <span>Shelf Photo</span>
        </button>
        <button id="manualModeBtn" type="button" data-mode="manual">
          <i data-lucide="pencil-line"></i>
          <span>Manual</span>
        </button>
        <button id="upcModeBtn" type="button" data-mode="upc">
          <i data-lucide="scan-barcode"></i>
          <span>UPC</span>
        </button>
      </nav>

      <main class="workspace">
        <section class="panel mode-panel active" id="shelfPanel" aria-label="Shelf photo batch">
          <div class="section-heading">
            <h2>Shelf Photo Batch</h2>
            <span class="model-pill">gpt-5.4-mini · low first</span>
          </div>

          <div class="photo-actions">
            <input id="takePhotoInput" type="file" accept="image/*" capture="environment" data-source="camera" hidden />
            <input id="galleryPhotoInput" type="file" accept="image/*" data-source="gallery" multiple hidden />
            <button class="button primary" id="takePhotoBtn" type="button">
              <i data-lucide="camera"></i>
              <span>Take photo</span>
            </button>
            <button class="button secondary" id="uploadPhotosBtn" type="button">
              <i data-lucide="image-up"></i>
              <span>Upload from gallery</span>
            </button>
            <button class="button quiet" id="clearPhotosBtn" type="button">
              <i data-lucide="eraser"></i>
              <span>Clear</span>
            </button>
          </div>

          <label class="wide-field">
            <span>Batch notes</span>
            <input id="batchNotesInput" type="text" autocomplete="off" placeholder="Optional" />
          </label>

          <div class="photo-grid" id="photoGrid" aria-label="Selected shelf photos"></div>

          <button class="button secondary full" id="submitBatchBtn" type="button">
            <i data-lucide="send"></i>
            <span>Queue photo batch</span>
          </button>
        </section>

        <section class="panel mode-panel" id="manualPanel" aria-label="Manual item entry">
          <div class="section-heading">
            <h2>Manual Item</h2>
            <button class="icon-button compact" id="clearManualBtn" type="button" title="Clear manual fields" aria-label="Clear manual fields">
              <i data-lucide="eraser"></i>
            </button>
          </div>

          <div class="field-grid">
            <label class="wide-field">
              <span>Item name</span>
              <input id="manualNameInput" type="text" autocomplete="off" placeholder="Budweiser Lager King Can" />
            </label>
            <label>
              <span>Size / package</span>
              <input id="manualSizeInput" type="text" autocomplete="off" placeholder="710 mL" />
            </label>
            <label>
              <span>UPC</span>
              <input id="manualUpcInput" type="text" inputmode="numeric" autocomplete="off" placeholder="Optional" />
            </label>
            <label class="wide-field">
              <span>Image link</span>
              <input id="manualImageInput" type="url" autocomplete="off" placeholder="Optional" />
            </label>
            <label class="wide-field">
              <span>Notes</span>
              <input id="manualNotesInput" type="text" autocomplete="off" placeholder="Optional" />
            </label>
          </div>

          <button class="button secondary full" id="manualAddBtn" type="button">
            <i data-lucide="plus"></i>
            <span>Add manual row</span>
          </button>
        </section>

        <section class="panel mode-panel" id="upcPanel" aria-label="UPC scanner">
          <div class="section-heading">
            <h2>UPC Fallback</h2>
            <span class="status-pill neutral" id="scannerStatus">Camera idle</span>
          </div>

          <div class="video-shell">
            <video id="preview" muted playsinline></video>
            <div class="reticle" aria-hidden="true">
              <span></span>
            </div>
            <div class="camera-message" id="cameraMessage">Camera idle</div>
          </div>

          <div class="command-row">
            <button class="button primary" id="startScanBtn" type="button">
              <i data-lucide="scan-barcode"></i>
              <span>Scan</span>
            </button>
            <button class="button quiet" id="stopScanBtn" type="button">
              <i data-lucide="square"></i>
              <span>Stop</span>
            </button>
            <button class="button secondary" id="voiceBtn" type="button" aria-pressed="false">
              <i data-lucide="mic"></i>
              <span>Voice</span>
            </button>
          </div>

          <label class="wide-field">
            <span>UPC item override</span>
            <input id="upcNameInput" type="text" autocomplete="off" placeholder="Optional" />
          </label>
        </section>

        <section class="panel feed-panel" aria-label="Review queue">
          <div class="section-heading">
            <h2>Review Queue</h2>
            <span class="count-pill" id="itemCount">0 rows</span>
          </div>
          <div class="status-strip">
            <span class="status-pill neutral" id="sheetStatus">Sheet not connected</span>
            <span class="status-pill ready" id="workflowStatus">Ready</span>
          </div>
          <div class="table-wrap">
            <table>
              <thead>
                <tr>
                  <th>Time</th>
                  <th>Type</th>
                  <th>Item / Batch</th>
                  <th>Category</th>
                  <th>Status</th>
                </tr>
              </thead>
              <tbody id="feedBody"></tbody>
            </table>
          </div>
          <div class="feed-actions">
            <button class="button quiet" id="clearFeedBtn" type="button">
              <i data-lucide="trash-2"></i>
              <span>Clear local feed</span>
            </button>
          </div>
        </section>
      </main>
    </div>

    <dialog class="settings-dialog" id="settingsDialog">
      <form method="dialog">
        <div class="dialog-head">
          <h2>Workflow Settings</h2>
          <button class="icon-button compact" value="cancel" type="submit" title="Close" aria-label="Close">
            <i data-lucide="x"></i>
          </button>
        </div>
        <label>
          <span>Apps Script Web App URL</span>
          <input id="webhookUrlInput" type="url" autocomplete="off" placeholder="https://script.google.com/macros/s/..." />
        </label>
        <label>
          <span>Shared secret</span>
          <input id="secretInput" type="text" autocomplete="off" placeholder="Optional" />
        </label>
        <label>
          <span>Store name</span>
          <input id="storeNameInput" type="text" autocomplete="off" placeholder="Optional" />
        </label>
        <div class="dialog-actions">
          <button class="button secondary" id="testSheetBtn" type="button">
            <i data-lucide="plug"></i>
            <span>Test</span>
          </button>
          <button class="button primary" id="saveSettingsBtn" value="default" type="submit">
            <i data-lucide="save"></i>
            <span>Save</span>
          </button>
        </div>
      </form>
    </dialog>

    <script type="module" src="./app.js"></script>
  </body>
</html>
